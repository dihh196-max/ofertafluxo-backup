<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>OfertaFluxo — Entrar</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/overrides.css"></head>
<body class="login-page"><main class="login-shell"><section class="login-card"><div class="brand login-brand"><span class="brand-mark">✦</span><span>Oferta<span>Fluxo</span></span></div><p class="eyebrow">ACESSO SEGURO</p><h1>Entre no seu painel</h1><p class="login-copy">Cada conta possui configurações, grupos, histórico e conexão do WhatsApp separados.</p><div id="login-message" class="login-message" hidden></div><form id="login-form"><label>Usuário<input id="login-username" autocomplete="username" required></label><label>Senha<input id="login-password" type="password" autocomplete="current-password" required></label><button class="primary wide" type="submit">Entrar</button></form><form id="totp-form" hidden><p>Digite o código de 6 dígitos do seu aplicativo autenticador.</p><label>Código<input id="login-totp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></label><button class="primary wide" type="submit">Verificar</button><button class="secondary wide" id="back-login" type="button">Voltar</button></form><div id="register-section" class="register-section" hidden><hr><h2>Criar conta</h2><p>Há espaço para até 3 usuários independentes.</p><form id="register-form"><label>Novo usuário<input id="register-username" autocomplete="username" minlength="3" maxlength="32" required></label><label>Senha (mínimo 12 caracteres)<input id="register-password" type="password" autocomplete="new-password" minlength="12" required></label><button class="secondary wide" type="submit">Criar conta</button></form></div></section></main><script src="/login.js"></script></body></html>
